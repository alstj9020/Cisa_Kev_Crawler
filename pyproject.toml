[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cisa-kev-crawler"
version = "0.1.0"
description = "CISA KEV 크롤러 — 하루보안 데이터 수집기"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
cisa-kev-crawler = "cisa_kev_crawler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cisa_kev_crawler"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
